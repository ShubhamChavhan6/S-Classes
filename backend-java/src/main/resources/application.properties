# Application Configuration
spring.application.name=sclasses-backend
server.port=8080

# H2 Database Configuration (In-Memory Database)
spring.datasource.url=jdbc:h2:mem:sclassesdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA Hibernate Auto-ddl
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# JWT Configuration
jwt.secret=sclasses-secret-key-2026-very-secure-jwt-signing-key-for-java-backend
jwt.expirationMs=86400000

# CORS Configuration
cors.allowed-origins=http://localhost:3000,http://localhost:5173
